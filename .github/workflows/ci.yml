name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hull
      - name: Build
        run: hull build -o hscli .
      - name: Unit
        run: bash tests/unit.sh
      - name: Smoke
        run: sh tests/smoke.sh ./hscli
