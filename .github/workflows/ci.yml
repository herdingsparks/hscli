name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/hull
      # hull check --types (the TypeScript compiler pinned in package-lock.json,
      # the manifest, imports and hull test), then hull build.
      - name: Check and build
        run: make
      - name: Smoke
        run: sh tests/smoke.sh ./hscli
